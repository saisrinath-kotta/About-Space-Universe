<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-pattern"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light custom-nav fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">HealthSphere</a>
  </div>
</nav>

<!-- ===== HEADER ===== -->
<section class="container pt-5 mt-5">
  <div class="text-center mb-4">
    <h1 id="diseaseTitle">Disease Name</h1>
    <p id="diseaseTag" class="opacity-75"></p>
  </div>

  <!-- ===== INFO GRID ===== -->
  <div class="row g-4">

    <!-- Symptoms -->
    <div class="col-lg-6">
      <div class="info-card">
        <h4>🔍 Symptoms</h4>
        <ul id="symptomsList"></ul>
      </div>
    </div>

    <!-- Causes -->
    <div class="col-lg-6">
      <div class="info-card">
        <h4>⚠️ Causes & Risk Factors</h4>
        <ul id="causesList"></ul>
      </div>
    </div>

    <!-- Prevention -->
    <div class="col-lg-6">
      <div class="info-card">
        <h4>🛡️ Prevention Tips</h4>
        <ul id="preventionList"></ul>
      </div>
    </div>

    <!-- Medication -->
    <div class="col-lg-6">
      <div class="info-card">
        <h4>💊 Common Medication</h4>
        <ul id="medicineList"></ul>
        <small class="text-muted">
          ⚠️ This information is for awareness only. Please consult a qualified doctor before taking any medication.
        </small>
      </div>
    </div>

  </div>
</section>

<!-- ===== CARD STYLE ===== -->
<style>
.info-card{
  background:var(--bg-soft);
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  height:100%;
}
</style>

<!-- ===== DATA SCRIPT ===== -->
<script>
const data = {

  covid:{
    title:"COVID-19",
    tag:"Respiratory viral infection",
    symptoms:[
      "Fever",
      "Dry cough",
      "Fatigue",
      "Loss of taste or smell",
      "Shortness of breath"
    ],
    causes:[
      "Infection by SARS-CoV-2 virus",
      "Close contact with infected person",
      "Crowded environments"
    ],
    prevention:[
      "Wear face mask in crowded places",
      "Wash hands regularly",
      "Maintain social distancing",
      "Get vaccinated"
    ],
    medicine:[
      "Paracetamol for fever",
      "Antiviral medications (doctor prescribed)",
      "Supportive care and hydration"
    ]
  },

  tb:{
    title:"Tuberculosis",
    tag:"Bacterial infection affecting lungs",
    symptoms:[
      "Persistent cough",
      "Chest pain",
      "Coughing blood",
      "Fever and night sweats",
      "Weight loss"
    ],
    causes:[
      "Mycobacterium tuberculosis bacteria",
      "Weak immune system",
      "Close contact with infected patient"
    ],
    prevention:[
      "BCG vaccination",
      "Cover mouth while coughing",
      "Proper ventilation",
      "Early medical screening"
    ],
    medicine:[
      "Isoniazid",
      "Rifampicin",
      "Ethambutol",
      "Pyrazinamide (as prescribed)"
    ]
  },

  dengue:{
    title:"Dengue Fever",
    tag:"Mosquito-borne viral disease",
    symptoms:[
      "High fever",
      "Severe headache",
      "Joint and muscle pain",
      "Skin rash",
      "Nausea or vomiting"
    ],
    causes:[
      "Aedes mosquito bite",
      "Stagnant water breeding",
      "Tropical climate exposure"
    ],
    prevention:[
      "Avoid stagnant water",
      "Use mosquito nets",
      "Wear full-sleeve clothes",
      "Use mosquito repellents"
    ],
    medicine:[
      "Paracetamol for fever",
      "Oral rehydration fluids",
      "Platelet monitoring under doctor"
    ]
  },

  diabetes:{
    title:"Diabetes",
    tag:"Chronic blood sugar disorder",
    symptoms:[
      "Frequent urination",
      "Increased thirst",
      "Unexplained weight loss",
      "Fatigue",
      "Blurred vision"
    ],
    causes:[
      "Insulin resistance",
      "Genetic factors",
      "Obesity",
      "Sedentary lifestyle"
    ],
    prevention:[
      "Maintain healthy weight",
      "Regular physical activity",
      "Balanced diet",
      "Regular sugar checkups"
    ],
    medicine:[
      "Metformin",
      "Insulin therapy",
      "Sulfonylureas (doctor prescribed)"
    ]
  },

  bp:{
    title:"Hypertension",
    tag:"High blood pressure condition",
    symptoms:[
      "Headache",
      "Dizziness",
      "Chest pain",
      "Shortness of breath",
      "Often no symptoms"
    ],
    causes:[
      "High salt intake",
      "Stress",
      "Obesity",
      "Genetics"
    ],
    prevention:[
      "Reduce salt intake",
      "Regular exercise",
      "Stress management",
      "Healthy diet"
    ],
    medicine:[
      "ACE inhibitors",
      "Beta blockers",
      "Calcium channel blockers"
    ]
  }

};

const params = new URLSearchParams(window.location.search);
const disease = params.get("disease");

if(data[disease]){
  const d = data[disease];

  document.getElementById("diseaseTitle").innerText = d.title;
  document.getElementById("diseaseTag").innerText = d.tag;

  const fill = (id, arr)=>{
    document.getElementById(id).innerHTML =
      arr.map(x=>`<li>${x}</li>`).join("");
  };

  fill("symptomsList", d.symptoms);
  fill("causesList", d.causes);
  fill("preventionList", d.prevention);
  fill("medicineList", d.medicine);
}
</script>

</body>
</html>
