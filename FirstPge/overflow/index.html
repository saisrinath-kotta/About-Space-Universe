<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overflow Example</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  background-color: skyblue;
  color: black;
  padding: 20px;
  text-align: center;
  font-size: 25px;
  border-radius: 50px;
  transition: all 0.4s ease;
  overflow: hidden;
  height: 150px;
  width: 150px;
  border-radius: 50%;
}
.box img{
    width: 180px;
    height: 180px;
}
</style>
</head>

<body>

<h2>Overflow CSS Feature</h2>
<p>Overflow property values are: visible, hidden, scroll, and auto.</p>

<div class="box">
 <img src ="/FirstPge/OIP.webp">
</div>

</body>
</html>
