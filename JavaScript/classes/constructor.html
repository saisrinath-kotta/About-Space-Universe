<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class emplpoyee{
        constructor(name,id){
            this.name = name;
            this.id = id;
        }
        display(){
            console.log("name = "+ this.name + "\nid = "+ this.id);

        }
    }
    let e = new emplpoyee("sai",261);
    e.display();

    class work extends emplpoyee{
        constructor(name,id,desig) {
            super(name,id);
            this.desig = desig;
            
        }
        display(){
            super.display();
            console.log("Designation = "+this.desig);
        }
    }
    let f = new work("sai",261,"byye");
    f.display();
    </script>
</body>
