<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="bg">
    <h1 id="heading">This is Javascript Introduction</h1>
    <button onclick="modify()">change</button>

    <script>
        function modify(){
            document.getElementById("heading").style.color = "green";
            document.getElementById("heading").textContent = "Introduction to JavaScript"
            document.getElementById("heading").style.textAlign ="center"
            document.getElementById("bg").style.backgroundColor="cyan"
        }
    </script>
    
</body>
</html>
