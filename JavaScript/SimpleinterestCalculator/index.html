<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
            background-color: #f0f8ff;
        }
        input {
            padding: 8px;
            margin: 8px;
            width: 200px;
        }
        button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
}
        #result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>
<body>

    <h1>Simple Interest Calculator</h1>

    <input type="number" id="principal" placeholder="Enter Principal"><br>
    <input type="number" id="rate" placeholder="Enter Rate (%)"><br>
    <input type="number" id="time" placeholder="Enter Time (years)"><br>

    <button onclick="showInterest()">Calculate</button>

    <p id="result"></p>

    <script>
        function showInterest() {
            const principal = parseFloat(document.getElementById("principal").value);
            const rate = parseFloat(document.getElementById("rate").value);
            const time = parseFloat(document.getElementById("time").value);

            const interest = (principal * rate * time) / 100;

            document.getElementById("result").textContent =
            "Simple Interest: " + interest.toFixed(2);
        }
    </script>

</body>
</html>
