<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-heading{
            background-color:pink;
        }
    </style>
</head>
<body>
    <script>
        let h1=document.createElement("h1");
        h1.textContent="Introduction to JAVASCRIPT";
        h1.classList.add("main-heading");
        h1.setAttribute("id","head");
        document.body.appendChild(h1);
        let p=document.createElement("p");
        p.textContent="This is an example to show Dom manipulation";
        document.body.appendChild(p);
        let button=document.createElement("button");
        button.textContent="get started";
        document.body.appendChild(button);
        //button click using addEventListener events are click,dbclick,mouseover,change,keyup,keydown,submit,cancel.
      button.addEventListener("mouseover", function() {
            h1.style.color = "yellow";
            p.style.color = "red";
            button.style.backgroundColor=("blue");
            
        });

    </script>`
</body>
</html>
